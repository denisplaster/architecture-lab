# Deploys to Vercel with the Vercel CLI. Needs three repository secrets:
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (the ids come from
# `vercel link`, in .vercel/project.json). Without them the job skips, so it
# is safe to keep alongside Vercel's own Git integration.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check for Vercel secrets
        id: gate
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel secrets are not configured; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        if: steps.gate.outputs.enabled == 'true'
        run: npm install --global vercel@latest
      - name: Pull project settings
        if: steps.gate.outputs.enabled == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.gate.outputs.enabled == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
